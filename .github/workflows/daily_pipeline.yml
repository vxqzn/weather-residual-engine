name: daily ingestion, retraining and docker audit

on:
    schedule:
        - cron: "0 2 * * *" 
    workflow_dispatch:
    push:
        branches: [ master ]

jobs:
    pipeline:
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - name: checkout repository
              uses: actions/checkout@v4

            - name: setup python 3.11
              uses: actions/setup-python@v5
              with:
                python-version: 3.11
                cache: "pip"

            - name: install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -e ".[dev]"

            - name: initialize test database schema
              env:
                DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
              run: |
                python -m twre.db.session

            - name: run pytest suite
              env:
                DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres  
              run: |
                pytest

            - name: run daily pipeline runner
              env:
                    DATABASE_URL: ${{ secrets.DATABASE_URL }}  
              run: |
                    python -m twre.pipeline.daily_runner
              
            - name: commit and push model artifacts
              run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git add artifacts/models/champion.joblib artifacts/models/ledger.json
                    git diff --staged --quiet || (git commit -m "chore(ci): update champion and audit ledger [skip ci]" && git push origin master)
            
            - name: run docker audit
              run: |
                    docker build -t twre:latest .
                    docker images twre:latest
